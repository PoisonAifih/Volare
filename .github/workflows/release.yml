name: Release

# Every push to main publishes a new build, so the phone can pull it with the in-app
# "Check for updates" button without touching a computer.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASES_REPO: PoisonAifih/Volare-ApkRelease

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Runs before the build so a token problem costs seconds instead of a full build.
      # Publishing still needs write access even though the repo is public.
      - name: Verify releases token
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret RELEASES_TOKEN is not set."
            exit 1
          fi

          if ! gh api "repos/$RELEASES_REPO" --jq .full_name > /dev/null 2>&1; then
            echo "::error::RELEASES_TOKEN cannot see $RELEASES_REPO. On a fine-grained token, make sure that repo is listed under Repository access with Contents set to Read and write."
            exit 1
          fi

          if [ "$(gh api "repos/$RELEASES_REPO" --jq .permissions.push)" != "true" ]; then
            echo "::error::RELEASES_TOKEN only has read access to $RELEASES_REPO. Raise the Contents permission to Read and write."
            exit 1
          fi

          echo "Token is good for $RELEASES_REPO"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compute version
        id: version
        run: |
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "tag=v0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set. Without the same key, the update cannot install over an older version."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          VOLARE_VERSION_CODE: ${{ steps.version.outputs.code }}
          # The secrets keep their original ONTHEFLY_ spelling. They are configured in GitHub,
          # not in this repository, so renaming them here would only make the lookup return
          # nothing. This step is where the two naming schemes meet.
          VOLARE_KEYSTORE_PASSWORD: ${{ secrets.ONTHEFLY_KEYSTORE_PASSWORD }}
          VOLARE_KEY_ALIAS: ${{ secrets.ONTHEFLY_KEY_ALIAS }}
          VOLARE_KEY_PASSWORD: ${{ secrets.ONTHEFLY_KEY_PASSWORD }}
        run: |
          # An empty value here makes Gradle fail with the opaque "SigningConfig is missing
          # required property" instead of naming the value that is absent.
          for name in VOLARE_KEYSTORE_PASSWORD VOLARE_KEY_ALIAS VOLARE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty. Check the matching ONTHEFLY_ secret in repository settings."
              exit 1
            fi
          done

          export VOLARE_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Stage APK
        id: apk
        run: |
          name="volare-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "path=$RUNNER_TEMP/$name" >> "$GITHUB_OUTPUT"

      - name: Publish release to the releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          # Passed through the environment so quotes or newlines in a commit message
          # cannot break the shell command.
          NOTES: ${{ github.event.head_commit.message || 'Manual release' }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.apk.outputs.path }}" \
            --repo "$RELEASES_REPO" \
            --title "Volare ${{ steps.version.outputs.name }}" \
            --notes "$NOTES"

      - name: Point latest.json at the new build
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          git clone "https://x-access-token:$GH_TOKEN@github.com/$RELEASES_REPO.git" releases-repo
          cd releases-repo

          # apkUrl is what the app downloads. The repo is public, so it needs no credentials.
          cat > latest.json <<JSON
          {
            "versionCode": ${{ steps.version.outputs.code }},
            "versionName": "${{ steps.version.outputs.name }}",
            "apkUrl": "https://github.com/$RELEASES_REPO/releases/download/${{ steps.version.outputs.tag }}/${{ steps.apk.outputs.name }}",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "Release ${{ steps.version.outputs.name }}"
          git push
